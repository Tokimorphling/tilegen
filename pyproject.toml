[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilegen"
version = "0.1.0"
description = "tilelang / NVRTC acceleration kernels for DiT (diffusion transformer) inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "tilegen contributors" }]
keywords = ["tilelang", "nvrtc", "dit", "int8", "quantization", "comfyui", "diffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "cuda-python>=12.0",
]

[project.optional-dependencies]
tilelang = ["tilelang>=0.1.12"]
comfyui = ["comfy-kitchen>=0.2.25"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["tilegen*"]
